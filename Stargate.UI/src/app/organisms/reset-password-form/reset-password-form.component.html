<div class="card">
  <h2 class="h5">Set New Password</h2>
  <p class="subtitle">Enter your new password below</p>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="success" class="alert alert-success">
    {{ success }}
  </div>

  <form *ngIf="!success" (ngSubmit)="onSubmit()">
    <app-form-field
      label="New Password"
      name="newPassword"
      type="password"
      placeholder="Enter new password"
      [(value)]="model.newPassword">
    </app-form-field>

    <app-form-field
      label="Confirm Password"
      name="confirmPassword"
      type="password"
      placeholder="Confirm new password"
      [(value)]="model.confirmPassword">
    </app-form-field>

    <app-button
      type="submit"
      kind="primary"
      class="w-100 mb-2"
      [disabled]="loading">
      Reset Password
    </app-button>

    <app-button
      type="button"
      kind="secondary"
      class="w-100"
      (pressed)="onCancel()">
      Back to Login
    </app-button>
  </form>

  <div *ngIf="success">
    <app-button
      type="button"
      kind="primary"
      class="w-100"
      (pressed)="onCancel()">
      Go to Login
    </app-button>
  </div>
</div>
