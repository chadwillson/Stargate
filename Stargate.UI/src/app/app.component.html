<div class="shell">
  <header class="shell__top">
    <div>
      <h1 class="logo">STARGATE</h1>
    </div>
    <div class="header-actions">
      <nav class="nav-links" *ngIf="isAuthenticated">
        <a routerLink="/people" routerLinkActive="active">Personnel</a>
        <a routerLink="/astronaut-duties" routerLinkActive="active">Astronaut Duty</a>
        <a routerLink="/admin" routerLinkActive="active" *ngIf="isAdmin">Admin</a>
      </nav>
      <app-button kind="secondary" (pressed)="toggleTheme()">
        {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
      </app-button>
      <div class="user-info" *ngIf="isAuthenticated && username">
        <span class="user-label">Logged in as:</span>
        <span class="username">{{ username }}</span>
      </div>
      <app-button kind="ghost" *ngIf="isAuthenticated" (pressed)="logout()">
        Logout
      </app-button>
    </div>
  </header>
  <section class="shell__body">
    <router-outlet></router-outlet>
  </section>
</div>
