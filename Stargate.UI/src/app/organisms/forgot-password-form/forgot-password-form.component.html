<div class="card">
  <h2 class="h5">Reset Password</h2>
  <p class="subtitle">Enter your email to receive a password reset link</p>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="success" class="alert alert-success">
    {{ success }}
  </div>

  <form *ngIf="!success" (ngSubmit)="onSubmit()">
    <app-form-field
      label="Email"
      name="email"
      type="email"
      placeholder="Enter your email"
      [(value)]="model.email">
    </app-form-field>

    <app-button
      type="submit"
      kind="primary"
      class="w-100 mb-2"
      [disabled]="loading">
      Send Reset Link
    </app-button>

    <app-button
      type="button"
      kind="secondary"
      class="w-100"
      (pressed)="onCancel()">
      Back to Login
    </app-button>
  </form>

  <div *ngIf="success">
    <app-button
      type="button"
      kind="primary"
      class="w-100"
      (pressed)="onCancel()">
      Back to Login
    </app-button>
  </div>
</div>
