<app-default-template>
  <div class="login-container">
    <app-forgot-password-form
      [error]="error"
      [success]="success"
      [loading]="loading"
      (submitEmail)="onSubmit($event)"
      (cancel)="goToLogin()">
    </app-forgot-password-form>

    <div *ngIf="loading" class="loading-overlay">
      <p>Sending reset link...</p>
    </div>
  </div>
</app-default-template>
