<app-default-template>
  <div class="login-container">
    <app-reset-password-form
      [error]="error"
      [success]="success"
      [loading]="loading"
      (submitPassword)="onSubmit($event)"
      (cancel)="goToLogin()">
    </app-reset-password-form>

    <div *ngIf="loading" class="loading-overlay">
      <p>Resetting password...</p>
    </div>
  </div>
</app-default-template>
